[project]
name = "club-server"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.135.1",
    "fpdf2>=2.8.9",
    "markdown>=3.10.2",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.26",
    "resend>=2.30.1",
    "sib-api-v3-sdk>=7.6.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "uvicorn[standard]>=0.41.0",
]

[project.scripts]
club_bootstrap = "club_server.bootstrap:main"
club_email_test = "club_server.mailer.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "httpx>=0.28.1",
    "pypdf==6.1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.uv]
package = true
# The version is read from VERSION, so a change there must rebuild the package.
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.pytest.ini_options]
markers = [
    "requirement(id): the requirement this test is the evidence for, as doc:Rn (e.g. programme:R3). Checked by tests/test_requirement_coverage.py.",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + the import/syntax subset of pycodestyle),
# made explicit so the enforced lint surface stays stable across ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# VERSION is the only version number; see CONTRIBUTING.md.
path = "VERSION"
pattern = "(?P<version>\\S+)"
